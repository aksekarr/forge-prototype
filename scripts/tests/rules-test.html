<!doctype html>
<!-- Independent tests for fortnight-rules.js. Written by Claude on 29 Sep 2026 BEFORE the implementation,
     with expected values worked out by hand from the rules in context/mirrorwood.md.
     Do not edit this file to make tests pass — fix the implementation instead.
     Open at http://localhost:4173/scripts/tests/rules-test.html -->
<meta charset="utf-8"><title>Rules tests</title>
<style>body{font:14px ui-monospace,monospace;padding:20px;background:#111;color:#ddd}.ok{color:#7c7}.bad{color:#f66}h1{font:600 18px system-ui}</style>
<h1 id="summary">Running…</h1>
<ol id="out"></ol>
<script src="../../fortnight-rules.js"></script>
<script>
(function () {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  function check(name, actual, expected) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    ok ? pass++ : fail++;
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? 'PASS  ' : 'FAIL  ') + name + (ok ? '' : '  — expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
    out.append(li);
  }
  function seq(values) { let i = 0; return function () { if (i >= values.length) throw new Error('rng called too many times'); return values[i++]; }; }
  function guard(name, fn, expected) { try { check(name, fn(), expected); } catch (e) { check(name + ' (threw: ' + e.message + ')', 'threw', expected); } }

  const R = window.MirrorwoodRules;
  if (!R) { document.getElementById('summary').textContent = 'FAIL — window.MirrorwoodRules not found'; document.title = 'FAIL'; return; }

  // --- Constants
  check('FORTNIGHT_LENGTH is 14', R.FORTNIGHT_LENGTH, 14);
  check('SHINY_RATE is 1/8', R.SHINY_RATE, 0.125);

  // --- stageForKept: evolution first. Odd kept days evolve. stage = ceil(kept/2), capped at 7.
  const stages = [[0,0],[1,1],[2,1],[3,2],[4,2],[5,3],[6,3],[7,4],[8,4],[9,5],[10,5],[11,6],[12,6],[13,7],[14,7],[15,7]];
  stages.forEach(([k, s]) => check('stageForKept(' + k + ')', R.stageForKept(k), s));

  // --- rewardForKeptDay: the k-th kept day (1-based) awards 'evolve' if odd, 'card' if even. Outside 1..14 → null.
  [[1,'evolve'],[2,'card'],[3,'evolve'],[12,'card'],[13,'evolve'],[14,'card'],[0,null],[15,null]]
    .forEach(([k, r]) => check('rewardForKeptDay(' + k + ')', R.rewardForKeptDay(k), r));

  // --- keptDaysInWindow(completeDates, firstDay): count completed dates inside the 14 calendar days from firstDay inclusive.
  check('window: basic, before/after excluded',
    R.keptDaysInWindow(['2026-10-06','2026-10-08','2026-10-19','2026-10-20','2026-10-05'], '2026-10-06'), 3);
  check('window: across the 25 Oct 2026 clock change and month end (day 14 = 6 Nov, day 15 = 7 Nov)',
    R.keptDaysInWindow(['2026-10-24','2026-10-25','2026-10-26','2026-11-06','2026-11-07'], '2026-10-24'), 4);
  check('window: duplicates counted once',
    R.keptDaysInWindow(['2026-10-06','2026-10-06'], '2026-10-06'), 1);
  check('window: empty', R.keptDaysInWindow([], '2026-10-06'), 0);

  // --- drawCard(cards, ownedIds, stage, rng). Order of rng use is part of the rule:
  // 1) eligible shinies = shinies (numeral null) with form <= stage, not owned, in file order.
  // 2) if any eligible shiny: r = rng(); if r < SHINY_RATE → return eligible[floor(rng() * eligible.length)].
  // 3) else unowned standard cards (file order): if any → return them[floor(rng() * length)].
  // 4) else if any eligible shiny → return eligible[floor(rng() * length)]. 5) else null.
  const cards = [
    { id: 'a', numeral: 'I' }, { id: 'b', numeral: 'II' }, { id: 'c', numeral: 'III' },
    { id: 's3', numeral: null, form: 3 }, { id: 's7', numeral: null, form: 7 }
  ];
  guard('draw: stage 1, no shiny eligible, no roll → a', () => R.drawCard(cards, [], 1, seq([0.0])), 'a');
  guard('draw: stage 3, roll 0.05 hits → s3', () => R.drawCard(cards, [], 3, seq([0.05, 0.9])), 's3');
  guard('draw: stage 3, roll exactly 0.125 misses → standard c', () => R.drawCard(cards, [], 3, seq([0.125, 0.7])), 'c');
  guard('draw: stage 7, s3 owned, hit → s7', () => R.drawCard(cards, ['s3'], 7, seq([0.1, 0.99])), 's7');
  guard('draw: stage 7, both eligible, hit, pick index 1 → s7', () => R.drawCard(cards, [], 7, seq([0.1, 0.6])), 's7');
  guard('draw: standards exhausted, roll misses → falls back to shiny s3', () => R.drawCard(cards, ['a','b','c'], 7, seq([0.5, 0.3])), 's3');
  guard('draw: nothing left for this stage → null', () => R.drawCard(cards, ['a','b','c'], 2, seq([])), null);
  guard('draw: a owned, roll misses → c', () => R.drawCard(cards, ['a'], 3, seq([0.9, 0.5])), 'c');
  guard('draw: everything owned → null', () => R.drawCard(cards, ['a','b','c','s3','s7'], 7, seq([])), null);
  guard('draw: shiny with form above stage never drops even when standards run out', () => R.drawCard(cards, ['a','b','c'], 6, seq([0.0, 0.0])), 's3');

  // --- Property: over many random draws, never returns an owned card or a locked shiny.
  let bad = 0;
  for (let i = 0; i < 2000; i++) {
    const owned = cards.filter(() => Math.random() < 0.4).map(c => c.id);
    const stage = Math.floor(Math.random() * 8);
    const id = R.drawCard(cards, owned, stage, Math.random);
    const card = cards.find(c => c.id === id);
    if (id !== null && (owned.includes(id) || (card.numeral === null && card.form > stage))) bad++;
  }
  check('property: 2000 random draws never give an owned card or a locked shiny', bad, 0);

  const summary = fail === 0 ? 'ALL ' + pass + ' PASS' : fail + ' FAIL, ' + pass + ' pass';
  document.getElementById('summary').textContent = summary;
  document.getElementById('summary').className = fail === 0 ? 'ok' : 'bad';
  document.title = fail === 0 ? 'ALL PASS' : 'FAIL';
}());
</script>
