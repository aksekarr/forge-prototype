<!doctype html>
<!-- REFERENCE ONLY — not loaded by the site.
     Extracted 29 Sep 2026 from the approved "Mirrorwood Shiny Cards" prototype (Claude artifact, 28 Sep).
     Agreed behaviour for every shiny card:
       reveal: ~2.8s burst (pop and turn, bright flash, full-strength holo-foil sweep, sparkle burst), then
       rest ("subtle"): flat at rest, faint foil + glare only while the pointer is over the card,
       one slow light glint across the card every ~9s. Reduced motion: no animation.
     Port the effect, not this markup: class names here (.card, .holo, .glare, .glint, .sparkles) must be
     renamed to the site's tarot- prefix. Card layout itself already exists in tarot.js/tarot.css. -->
<meta charset="utf-8"><title>Shiny reference</title>
<style>
.stage{perspective:1100px;width:100%}
.card{position:relative;width:100%;aspect-ratio:2/3;container-type:inline-size;border-radius:2.2%;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;
  box-shadow:0 18px 40px rgba(0,0,0,.55);transform-style:preserve-3d;overflow:hidden;background:#140a14}
.card.live{transition:none}
.card img{position:absolute;display:block;image-rendering:pixelated;max-width:none}
.art{left:8.98%;top:12.76%;width:82.03%;height:54.69%;object-fit:cover}
.frame{inset:0;width:100%;height:100%}
.name{position:absolute;left:9.47%;top:4.69%;width:80.96%;height:7.42%;display:flex;align-items:center;justify-content:center;gap:2.4cqw;
  font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:600;font-size:4.9cqw;letter-spacing:.08em;color:var(--ink)}
.name .num{color:#7b240d}
.name .star{color:#b8801f;font-family:system-ui,sans-serif;font-size:4cqw}
.text{position:absolute;left:14.2%;top:70.4%;width:71.6%;height:20.1%;display:flex;align-items:center;justify-content:center;
  font-size:3.55cqw;line-height:1.36;color:var(--ink);text-align:center;text-wrap:balance}
.text p{margin:0}

/* holo foil */
.holo,.glare,.sparkles{position:absolute;inset:0;pointer-events:none}
.holo{
  background:
    repeating-linear-gradient(115deg,
      rgba(255,80,80,.0) 0%, rgba(255,90,90,.55) 4%, rgba(255,210,80,.55) 8%,
      rgba(120,255,140,.5) 12%, rgba(80,200,255,.55) 16%, rgba(190,110,255,.55) 20%, rgba(255,80,80,.0) 24%);
  background-size:260% 260%;
  background-position:var(--hx,50%) var(--hy,50%);
  mix-blend-mode:color-dodge;opacity:.42;
  -webkit-mask-image:linear-gradient(to bottom,#000 0 66%,rgba(0,0,0,.18) 69%,rgba(0,0,0,.18) 92%,#000 95%);
          mask-image:linear-gradient(to bottom,#000 0 66%,rgba(0,0,0,.18) 69%,rgba(0,0,0,.18) 92%,#000 95%);
}
.glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,240,.55),rgba(255,255,255,0) 42%);mix-blend-mode:overlay;opacity:.8}
.sparkles i{position:absolute;width:2.2cqw;height:2.2cqw;background:
  conic-gradient(from 45deg,transparent 0 10%,#fff 12% 13%,transparent 15% 35%,#fff 37% 38%,transparent 40% 60%,#fff 62% 63%,transparent 65% 85%,#fff 87% 88%,transparent 90%);
  border-radius:50%;filter:drop-shadow(0 0 3px #ffe9a8);opacity:0;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.2}}
.card:not(.shiny) .holo,.card:not(.shiny) .glare,.card:not(.shiny) .sparkles,.card:not(.shiny) .glint{display:none}
/* resting states */
.card.rest-subtle .holo{opacity:0;transition:opacity .4s ease}
.card.rest-subtle.live .holo{opacity:.16}
.card.rest-subtle .glare{opacity:0;transition:opacity .4s ease}
.card.rest-subtle.live .glare{opacity:.35}
.card.rest-subtle .sparkles,.card.rest-off .sparkles{display:none}
.card.rest-off .holo,.card.rest-off .glare{display:none}
.glint{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
.glint::before{content:"";position:absolute;top:-20%;left:-60%;width:28%;height:140%;transform:rotate(22deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,248,220,.55),rgba(255,255,255,0));mix-blend-mode:overlay}
.card.rest-subtle .glint{display:block}
.card.rest-subtle .glint::before{animation:glint 9s ease-in-out 1.5s infinite}
@keyframes glint{0%{left:-60%}14%{left:130%}100%{left:130%}}
/* the reveal */
.card.reveal{animation:pop 2.8s cubic-bezier(.2,.9,.25,1) both}
.card.reveal .holo{opacity:.85;animation:foil-sweep 2.8s ease-in-out both}
.card.reveal .glare{animation:flash 2.8s ease-out both}
.card.reveal .sparkles i{animation:burst 2.8s ease-out both}
@keyframes pop{0%{transform:scale(.86) rotateY(-14deg);filter:brightness(1.8)}18%{transform:scale(1.04) rotateY(4deg);filter:brightness(1.35)}40%{transform:scale(1) rotateY(0)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes foil-sweep{0%{background-position:0% 0%;opacity:.95}70%{background-position:100% 100%;opacity:.7}100%{background-position:100% 100%;opacity:0}}
@keyframes flash{0%{opacity:1;transform:translateX(-30%)}50%{opacity:.8;transform:translateX(30%)}100%{opacity:0;transform:translateX(30%)}}
@keyframes burst{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.4) rotate(45deg)}55%{opacity:.8;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(.3) rotate(135deg)}}

@media (prefers-reduced-motion:reduce){.card{transition:none}.card.reveal,.card.reveal .holo,.card.reveal .glare,.card.reveal .sparkles i,.card.rest-subtle .glint::before{animation:none}.card.reveal .holo{opacity:.3}}
</style>
<!-- Overlay layers placed inside the card element, above art/frame/text: -->
<template id="shiny-overlays">
<div class="holo"></div><div class="glare"></div><div class="glint"></div>
<div class="sparkles">
  <i style="left:18%;top:20%;animation-delay:.1s"></i>
  <i style="left:74%;top:16%;animation-delay:1.1s"></i>
  <i style="left:62%;top:52%;animation-delay:.6s"></i>
  <i style="left:24%;top:58%;animation-delay:1.8s"></i>
  <i style="left:86%;top:40%;animation-delay:2.2s"></i>
  <i style="left:46%;top:6%;animation-delay:1.4s"></i>
</div>
</template>
<!-- Pointer tracking, reveal and rest state (prototype script): -->
<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const card = document.getElementById('fury');
  let idleTimer;
  function move(e){
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    if (card.classList.contains('reveal')) return; card.classList.add('live');
    if (!reduce){
      card.style.setProperty('--ry', ((x - .5) * 18).toFixed(2) + 'deg');
      card.style.setProperty('--rx', ((.5 - y) * 18).toFixed(2) + 'deg');
    }
    card.style.setProperty('--hx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--hy', (y * 100).toFixed(1) + '%');
    card.style.setProperty('--gx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
    clearTimeout(idleTimer);
  }
  function leave(){
    card.classList.remove('live');
    card.style.setProperty('--rx','0deg'); card.style.setProperty('--ry','0deg');
  }
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerleave', leave);
  card.addEventListener('pointerup', leave);
  card.style.touchAction = 'none';

  let rest = 'rest-subtle';
  function reveal(){
    card.classList.remove('rest-subtle','rest-off','reveal','live');
    void card.offsetWidth;
    card.classList.add('reveal');
    setTimeout(() => { card.classList.remove('reveal'); card.classList.add(rest); }, 2800);
  }
  document.getElementById('reveal').addEventListener('click', reveal);
  for (const id of ['rest-subtle','rest-off']){
    document.getElementById(id).addEventListener('click', () => {
      rest = id;
      document.getElementById('rest-subtle').setAttribute('aria-pressed', String(id === 'rest-subtle'));
      document.getElementById('rest-off').setAttribute('aria-pressed', String(id === 'rest-off'));
      reveal();
    });
  }
  setTimeout(reveal, 500);
})();
</script>
