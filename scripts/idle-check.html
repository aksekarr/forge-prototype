<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idle animation checks</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #f4f1df; background: #203326; }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    main { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
    figure { display: grid; place-items: center; min-width: 150px; min-height: 260px; margin: 0; padding: 14px; border: 1px solid #90ae7d; background: #567d46; }
    figcaption { align-self: start; font-weight: 700; }
    img { display: block; width: auto; max-width: 190px; height: 210px; object-fit: contain; image-rendering: crisp-edges; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>Idle animation checks</h1>
  <main id="previews"></main>
  <script>
    const STANDARD = [[1, 500], [2, 450], [1, 350], [4, 450], [1, 500],
      [2, 450], [3, 140], [1, 350], [4, 450]];
    const STAGE_FOUR = [[1, 500], [2, 450], [1, 350], [4, 450], [1, 500],
      [2, 450], [3, 140], [1, 350], [1, 450]];
    const BREATHING = [[1, 500], [2, 450], [1, 350], [1, 450], [1, 500],
      [2, 450], [3, 140], [1, 350], [1, 450]];
    const SPECIAL = [[4, 220], [5, 900], [4, 220], [1, 600]];
    const path = (stage, frame) => `../assets/stage-${stage}-idle-${frame}.png`;

    for (let stage = 1; stage <= 7; stage += 1) {
      const figure = document.createElement('figure');
      const caption = document.createElement('figcaption');
      const preview = new Image();
      caption.textContent = `Stage ${stage}`;
      preview.src = path(stage, 1);
      preview.alt = `Animated stage ${stage} creature`;
      figure.append(caption, preview);
      document.querySelector('#previews').append(figure);

      const sequence = stage <= 3 ? STANDARD
        : stage === 4 ? STAGE_FOUR
          : [...BREATHING, ...BREATHING, ...SPECIAL];
      let step = 0;
      function playNext() {
        const [frame, duration] = sequence[step];
        preview.src = path(stage, frame);
        step = (step + 1) % sequence.length;
        window.setTimeout(playNext, duration);
      }
      playNext();
    }
  </script>
</body>
</html>
